name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt pytest

      - name: Run tests
        run: python -m pytest -q agent/tests

      - name: Build executable directory
        run: python -m PyInstaller --clean --noconfirm packaging/agent-data-pipeline.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "agent-data-pipeline-smoke"
          $env:AGENT_USER_DATA_DIR = $data
          $process = Start-Process `
            -FilePath ".\dist\AgentDataPipeline\AgentDataPipeline.exe" `
            -ArgumentList "--port", "8770", "--no-browser" `
            -PassThru `
            -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($process.HasExited) {
                $log = Join-Path $data "logs\launcher.log"
                if (Test-Path $log) { Get-Content $log }
                throw "Packaged application exited before becoming ready (exit code $($process.ExitCode))"
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8770/api/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) {
              $log = Join-Path $data "logs\launcher.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Packaged health check failed"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist/AgentDataPipeline/* -DestinationPath AgentDataPipeline-windows-x64-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgentDataPipeline-windows-x64-${{ github.ref_name }}
          path: AgentDataPipeline-windows-x64-${{ github.ref_name }}.zip

      - name: Create release and attach archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exists = gh release list --json tagName --jq ".[] | select(.tagName == `"${{ github.ref_name }}`") | .tagName"
          if (-not $exists) {
            gh release create "${{ github.ref_name }}" `
              "AgentDataPipeline-windows-x64-${{ github.ref_name }}.zip" `
              --title "Agent Data Pipeline ${{ github.ref_name }}" `
              --generate-notes
          } else {
            gh release upload "${{ github.ref_name }}" `
              "AgentDataPipeline-windows-x64-${{ github.ref_name }}.zip" `
              --clobber
          }